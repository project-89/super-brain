editions:
  # Register caps realizing the simplified-retelling case, including the
  # compression fix for linter rule 10 (§14, §17): the bridge is not shown,
  # but its beat covers it, so later effects keep a reachable explanation.
  - id: edt_bedtime_fellowship
    mythos: mth_fellowship
    title: A Bedtime Fellowship
    renderer: picture_book
    audience:
      knower: aud_bedtime_listeners
      register: {reading_level: pre-K, valence_floor: -0.6, magnitude_cap: 0.85}
    selection:
      include:
        - {arcs: [arc_frodo_burden, arc_fellowship_unity]}
    sequence:
      - {segment: seg_tale, order: chronological}
    units:
      kind: chapter
      boundaries: auto_convergence
    compressions:
      - events: [evt_005]
        beat:
          title: A fright in the night
          summary: A shadow reached for Frodo, and brave friends drove it away.
      - events: [evt_010, evt_011]
        beat:
          title: The wizard says goodbye
          summary: In a dark place, the old wizard stayed behind so his friends could reach the light.
    schedule: null

  # POV as a knowledge filter (§14): the same fabula, told from Frodo's side.
  - id: edt_frodo_pov
    mythos: mth_fellowship
    title: Through Frodo’s Eyes
    renderer: episode_outline
    audience:
      knower: aud_readers
    pov: chr_frodo
    sequence:
      - {segment: seg_main, order: chronological}
    units:
      kind: episode
      boundaries: auto_convergence
      cut: resolution
    reveals:
      # The audience learns Boromir's desire at the Council; Boromir himself
      # learns it at Amon Hen — self-directed irony held open for 4 months.
      - {fact: fct_boromir_desires_ring, at: seg_main/evt_007}
    schedule: null
